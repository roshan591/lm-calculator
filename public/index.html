<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Last Mile Cost Calculator — Xindus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface2:#f0f2f5;--border:#e2e5ea;--border2:#d0d4db;
  --text:#1a1d23;--text2:#5c6370;--text3:#8b919e;
  --blue:#0077b6;--blue-bg:#e8f4fd;--teal:#0f766e;--teal-bg:#e6f7f6;
  --green:#166534;--green-bg:#dcfce7;--orange:#b45309;--orange-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fee2e2;--purple:#6d28d9;--purple-bg:#ede9fe;
  --font:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
  --radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
input,select,button{font-family:var(--font)}
/* LAYOUT */
.app{display:grid;grid-template-rows:56px 1fr;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo svg{color:var(--blue)}
.header-title{font-size:16px;font-weight:600;letter-spacing:-.3px}
.header-sub{font-size:12px;color:var(--text2);padding:3px 8px;background:var(--surface2);border-radius:20px;border:1px solid var(--border)}
.main{display:grid;grid-template-columns:200px 1fr;height:calc(100vh - 56px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px 0;overflow-y:auto}
.sidebar-section{padding:8px 16px 4px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;border-radius:0;font-size:13px;color:var(--text2);transition:all .12s;border-left:3px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.content{padding:24px;overflow-y:auto;background:var(--bg)}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.card-sub{font-size:12px;color:var(--text2);margin-bottom:16px}
/* METRIC CARDS */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.metric-value{font-size:24px;font-weight:600;font-family:var(--mono);color:var(--text)}
.metric-value.green{color:var(--teal)}
/* BUTTONS */
.btn{padding:7px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--text);transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#005f92;border-color:#005f92}
.btn-sm{padding:5px 12px;font-size:12px}
/* FORM */
.form-group{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label.lbl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
input.inp,select.inp{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border .12s}
input.inp:focus,select.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,119,182,.1)}
/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--text2);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(0,0,0,.015)}
td.mono{font-family:var(--mono);font-size:12px}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-teal{background:var(--teal-bg);color:var(--teal)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-gray{background:var(--surface2);color:var(--text2)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:32px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:var(--blue-bg)}
.upload-zone-icon{width:40px;height:40px;margin:0 auto 10px;color:var(--text3)}
.upload-zone-label{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
.upload-zone-hint{font-size:12px;color:var(--text2)}
/* STATUS */
.toast{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.toast-success{background:var(--green-bg);color:var(--green)}
.toast-error{background:var(--red-bg);color:var(--red)}
/* TOGGLE */
.tab-pills{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius);padding:3px;border:1px solid var(--border);width:fit-content;margin-bottom:16px}
.tab-pill{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--text2);transition:all .12s}
.tab-pill.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* CARRIER COLORS */
.c-usps-ga{background:#e8f4fd;color:#0077b6}
.c-usps-pm{background:#e0f7fa;color:#0097a7}
.c-uniuni{background:#e6f7f6;color:#0f766e}
.c-ups{background:#fff3e0;color:#e65100}
/* CHOSEN CELL */
.chosen-cell{background:#e6f7f6;font-weight:600;color:var(--teal)}
/* RULES TABLE */
.rules-carrier-header{display:flex;align-items:center;gap:8px;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px}
.carrier-dot{width:10px;height:10px;border-radius:50%}
/* RESPONSIVE */
@media(max-width:768px){.main{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>

// ═══════ ENGINE ═══════
function uspsZone(z){const p=parseInt(String(z).padStart(5,'0').slice(0,3));if(p<=119||(p>=180&&p<=191))return 2;if((p>=120&&p<=149)||(p>=192&&p<=269))return 3;if((p>=150&&p<=179)||(p>=270&&p<=289)||(p>=430&&p<=499)||(p>=530&&p<=549))return 4;if((p>=290&&p<=349)||(p>=400&&p<=429)||(p>=500&&p<=529)||(p>=550&&p<=599)||(p>=600&&p<=629)||(p>=460&&p<=479))return 5;if((p>=350&&p<=399)||(p>=630&&p<=693)||(p>=700&&p<=729))return 6;if((p>=730&&p<=799)||(p>=570&&p<=589)||(p>=800&&p<=816)||(p>=820&&p<=839)||(p>=870&&p<=888))return 7;return 8;}

function getRate(rd,svc,zone,wt,unit){const t=rd[svc];if(!t)return null;const z=String(zone);if(unit==='OZ'){const oz=t.oz?.[z];if(oz)return oz[String(Math.min(Math.ceil(wt),16))]??null;}const lb=t.lbs?.[z];if(!lb)return null;const keys=Object.keys(lb).map(Number).sort((a,b)=>a-b);const k=keys.filter(k=>k<=Math.ceil(wt));return k.length?lb[String(k[k.length-1])]:null;}

function isMpSvc(rules,carrier,mp){const svc=rules[carrier];if(!svc)return false;const m=(mp||'').toLowerCase();const mps=svc.marketplaces.map(x=>x.toLowerCase());if(mps.includes(m))return true;if(m==='etsy_usa'&&mps.includes('etsy'))return true;if(carrier==='UNIUNI'&&m==='amazon fba'&&mps.includes('amazon'))return true;if(mps.includes('other'))return true;return false;}

function calcCost(box,carrier){
  const svc=RULES[carrier];if(!svc)return{ok:false,reason:'Unknown carrier'};
  const{grossKg,L_cm,W_cm,H_cm,postal,marketplace,isPO}=box;
  const gLbs=grossKg*2.20462;const Li=L_cm/2.54,Wi=W_cm/2.54,Hi=H_cm/2.54;
  const vCin=Li*Wi*Hi;const sides=[L_cm,W_cm,H_cm].sort((a,b)=>b-a);
  const lgCm=sides[0]+2*(sides[1]+sides[2]);
  if(!isMpSvc(RULES,carrier,marketplace))return{ok:false,reason:'MP not serviceable'};
  if(isPO&&!svc.poAddress)return{ok:false,reason:'PO Box not serviceable'};
  let zone;
  if(carrier==='UNIUNI'){const zk=String(postal).padStart(5,'0');zone=state.zoneMap.uniuni[zk]??null;if(!zone)return{ok:false,reason:'ZIP not in UniUni coverage'};}
  else zone=uspsZone(postal);
  if(carrier==='UNIUNI'){if(gLbs>svc.maxWeight)return{ok:false,reason:'Exceeds 30lb limit'};if(sides[0]/2.54>svc.maxLongestInch)return{ok:false,reason:'Longest side > 20in'};if(vCin>svc.maxCubicIn)return{ok:false,reason:'Volume > 1728 cu.in'};}
  const volLbs=(carrier==='UNIUNI'||vCin>svc.volThreshold)?vCin/svc.volFactor:0;
  const chgLbs=Math.max(gLbs,volLbs);
  if(chgLbs>(svc.maxWeight||150))return{ok:false,reason:`Weight ${chgLbs.toFixed(1)}lbs > max`};
  const isOz=(carrier!=='UPS')&&chgLbs<1.0;
  const base=getRate(state.rateData,carrier,zone,isOz?chgLbs*16:chgLbs,isOz?'OZ':'LBS');
  if(base==null)return{ok:false,reason:`No rate: ${chgLbs.toFixed(2)}lbs z${zone}`};
  const sur=[];
  if(carrier==='USPS_GA'||carrier==='USPS_PM'){const os=svc.oversize;if(sides[0]>os.L1.t)sur.push({n:'Oversize L1',a:os.L1.c});if(sides[1]>os.L2.t)sur.push({n:'Oversize L2',a:os.L2.c});if(sides[2]>os.L3.t)sur.push({n:'Oversize L3',a:os.L3.c});const ol=svc.overlength;if(sides[0]>ol.t&&sides[0]<=ol.limit)sur.push({n:'Overlength',a:ol.c});if(sides[0]>ol.limit)sur.push({n:'OverlengthLimit',a:ol.lc});if(vCin>svc.overvolume.t)sur.push({n:'Overvolume',a:svc.overvolume.c});}
  if(carrier==='UPS'){if(grossKg<10)sur.push({n:'Residential',a:svc.rsc.c});if(gLbs>svc.overweight.t)sur.push({n:'Overweight',a:0,note:'Region-based'});if(sides[0]>svc.overdimension.L1||sides[1]>svc.overdimension.L2||lgCm>svc.overdimension.LG)sur.push({n:'Overdimension',a:0,note:'Region-based'});if(sides[0]>svc.largePackage.L1||lgCm>svc.largePackage.LG)sur.push({n:'Large Package',a:0});if(sides[0]>svc.packaging.L1||sides[1]>svc.packaging.L2)sur.push({n:'Packaging',a:0,note:'Region-based'});const sub=base+sur.reduce((s,x)=>s+(x.a||0),0);sur.push({n:'Fuel (18.03%)',a:+(sub*svc.fuelSurcharge).toFixed(2)});}
  const surT=sur.reduce((s,x)=>s+(x.a||0),0);
  return{ok:true,carrier,zone,chgLbs:+chgLbs.toFixed(4),volLbs:+volLbs.toFixed(4),unit:isOz?'OZ':'LBS',base,sur,surT:+surT.toFixed(2),total:+(base+surT).toFixed(2)};
}

function runCalc(src){
  return src.map(box=>{
    const costs=CARRIERS.map(c=>calcCost(box,c.key));
    const el=costs.filter(c=>c.ok);
    const cheapest=el.length?el.reduce((a,b)=>a.total<b.total?a:b):null;
    return{box,costs,cheapest};
  });
}

// ═══════ EXCEL PARSING ═══════
function parseXlsx(buf,hint){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const name=hint?wb.SheetNames.find(n=>n.toLowerCase().includes(hint.toLowerCase()))||wb.SheetNames[0]:wb.SheetNames[0];
  return XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:null});
}

function mapRow(row){
  const g=names=>{for(const n of names){const k=Object.keys(row).find(k=>k.toLowerCase().trim()===n);if(k&&row[k]!=null)return row[k];}return null;};
  return{
    awb:String(g(['awb','tracking'])||''),
    boxId:String(g(['boxes','box_id','box id'])||''),
    grossKg:parseFloat(g(['gross weight','grossweight','gross_weight'])||0),
    L_cm:parseFloat(g(['length','l cm','l_cm'])||0),
    W_cm:parseFloat(g(['width','w cm','w_cm'])||0),
    H_cm:parseFloat(g(['height','h cm','h_cm'])||0),
    postal:String(g(['reciever postal code','postal code','zip','zipcode','receiver postal code'])||'').replace(/[^0-9]/g,'').padStart(5,'0'),
    marketplace:String(g(['market_place','marketplace','market place'])||''),
    isPO:String(g(['is po address','is_po_address'])||'no').toLowerCase()==='yes'
  };
}

  const rows=zones.map(z=>{const r={z};CARRIERS.forEach(c=>{const v=getRate(state.rateData,c.key,z,wt,'LBS');r[c.key]=v;});return r;});

  el.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:20px;align-items:center"><h2 style="font-size:18px;font-weight:600;flex:1">Rate Analysis</h2></div>
    <div class="card">
      <div style="display:flex;gap:16px;align-items:flex-end;margin-bottom:20px">
        <div class="form-group" style="margin:0"><label class="lbl">Weight (lbs)</label>
          <input class="inp" type="number" style="width:110px" value="${wt}" min="0.1" max="100" step="0.5" oninput="window._anaWt=parseFloat(this.value)||1;renderAnalysis()"/>
        </div>
        <div style="font-size:12px;color:var(--text2);padding-bottom:8px">Showing base rates only — surcharges depend on dimensions and address</div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Zone</th>
              ${CARRIERS.map(c=>`<th style="color:${c.color}">${c.label}</th>`).join('')}
              <th>Cheapest</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((row,i)=>{
              const eligibles=CARRIERS.map(c=>({...c,r:row[c.key]})).filter(c=>c.r!=null);
              const ch=eligibles.length?eligibles.reduce((a,b)=>a.r<b.r?a:b):null;
              return`<tr style="${i%2?'background:var(--surface2)':''}">
                <td style="font-weight:600">Zone ${row.z}</td>
                ${CARRIERS.map(c=>{const r=row[c.key];const isM=ch?.key===c.key&&r!=null;return`<td class="mono" style="${isM?`color:${c.color};font-weight:700;background:${c.color}11`:''}">${r!=null?'$'+r.toFixed(2):'-'}</td>`;}).join('')}
                <td>${ch?badge(ch.cls,ch.label):'-'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ═══════ EVENT HANDLERS ═══════
function switchTab(el,tab){
  $$('.nav-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  $$('.tab-content').forEach(x=>x.style.display='none');
  $(`#tab-${tab}`).style.display='';
  ({calculator:renderCalculator,rates:renderRates,rules:renderRules,zones:renderZones,analysis:renderAnalysis})[tab]?.();
}

function setMode(mode,btn){
  btn.parentElement.querySelectorAll('.tab-pill').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  $('#mode-upload').style.display=mode==='upload'?'':'none';
  $('#mode-manual').style.display=mode==='manual'?'':'none';
}

function handleShipDrop(e){e.preventDefault();$('#ship-drop').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)handleShipFile({target:{files:[f]}});}

async function handleShipFile(e){
  const f=e.target.files[0];if(!f)return;
  try{const buf=await f.arrayBuffer();const rows=parseXlsx(new Uint8Array(buf),'shipment');state.shipments=rows.map(r=>mapRow(r)).filter(r=>r.grossKg>0);state.results=[];renderCalculator();show(`${state.shipments.length} shipments loaded from ${f.name}`);}
  catch(err){show('Failed to parse: '+err.message,'error');}
}

async function handleRateFile(e){
  const f=e.target.files[0];if(!f)return;
  try{const buf=await f.arrayBuffer();const rows=parseXlsx(new Uint8Array(buf));let n=0;
    rows.forEach(r=>{const s=String(r.Service||r.service||'');const z=String(r.Zone||r.zone||'');const w=String(r.LBS||r.lbs||r.Weight||'');const u=String(r.Unit||r.unit||'lbs').toLowerCase();const rate=parseFloat(r.Rate||r.rate||0);const sk=s.includes('GROUND_ADVANTAGE')||s.includes('Ground Advantage')?'USPS_GA':s.includes('PRIORITY')||s.includes('Priority Mail')?'USPS_PM':s.includes('UniUni')||s.includes('UNIUNI')?'UNIUNI':s.includes('UPS')?'UPS':null;if(!sk||!z||!w||!rate)return;if(!state.rateData[sk])state.rateData[sk]={oz:{},lbs:{}};const tbl=u.includes('oz')?'oz':'lbs';if(!state.rateData[sk][tbl][z])state.rateData[sk][tbl][z]={};state.rateData[sk][tbl][z][w]=rate;n++;});
    show(`Updated ${n} rate entries from ${f.name}`);renderRates();}
  catch(err){show('Failed to parse: '+err.message,'error');}
}

async function handleZoneFile(e){
  const f=e.target.files[0];if(!f)return;
  try{const buf=await f.arrayBuffer();const rows=parseXlsx(new Uint8Array(buf),'zone');let n=0;
    rows.forEach(r=>{const carrier=String(r.carrier||r.Carrier||'').toLowerCase();const src=String(r.source||r.Source||'JFK').toUpperCase();const dest=String(r.destination||r.Destination||'').padStart(5,'0');const zone=parseInt(r.value||r.Value||r.Zone||r.zone||0);if(!dest||!zone)return;const key=carrier.includes('uni')?'uniuni':'usps';if(!state.zoneMap[key])state.zoneMap[key]={};if(src==='JFK'||!state.zoneMap[key][dest])state.zoneMap[key][dest]=zone;n++;});
    show(`Loaded ${n} zone entries from ${f.name}`);renderZones();}
  catch(err){show('Failed to parse: '+err.message,'error');}
}

function runCalcUI(){
  const mode=$('.tab-pill.active')?.textContent?.includes('Manual')?'manual':'upload';
  let src;
  if(mode==='manual'){
    src=[{awb:'MANUAL',boxId:'BOX-1',grossKg:parseFloat($('#m-gw').value)||0,L_cm:parseFloat($('#m-l').value)||0,W_cm:parseFloat($('#m-w').value)||0,H_cm:parseFloat($('#m-h').value)||0,postal:$('#m-zip').value.padStart(5,'0'),marketplace:$('#m-mp').value,isPO:$('#m-po').checked}];
  }else{
    if(!state.shipments.length){alert('Upload a shipment file first.');return;}
    src=state.shipments;
  }
  state.results=runCalc(src);renderCalculator();
}

// ═══════ INIT ═══════
renderCalculator();
</script>
</body>
</html>
